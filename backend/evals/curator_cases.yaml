    page:
      url: https://blueteamjournal.example/how-keyloggers-work
      title: How keyloggers work, and how to catch one
      status_reason: borderline quality (0.59)
      quality_score: 0.59
      content: |
        A keylogger records what you type. Hardware keyloggers sit between a
        keyboard and a computer; software keyloggers run as hidden programs that
        hook into the operating system's keyboard events.

        Software keyloggers usually arrive the way other malware does: a
        malicious attachment, a fake installer, or a cracked program. Once
        running, they hide in startup entries and send what they capture to a
        remote server at intervals.

        Defenders can look for the traces. Check startup programs and scheduled
        tasks for entries you don't recognize. Watch for unknown processes that
        make regular outbound connections. Endpoint protection tools flag known
        keyboard hooks, and on managed machines, application allow-listing stops
        unknown programs from running at all.

        The strongest defense against stolen passwords is to make them less
        useful: two-factor authentication with a hardware key or app means a
        captured password alone isn't enough.
    evidence:
