  - id: good-spaced-repetition
    tags: [good]
    expected: approve
    topics: [learning-how-to-learn]
    why: A clear, original explanation of spaced repetition with practical advice.
    page:
      url: https://quietstudy.example/posts/why-spacing-works
      title: Why spacing your reviews beats cramming
      status_reason: borderline quality (0.55)
      quality_score: 0.55
      summary: Explains the spacing effect and how to plan reviews so memories last.
      content: |
        Most of us learned to study by cramming: read the chapter five times the
        night before, pass the test, forget nearly everything a week later. The
        problem isn't effort. It's timing.

        When you review something you just read, it still feels familiar, so the
        review takes little effort and teaches your brain little. When you wait
        until you have almost forgotten it, pulling it back out of memory is hard,
        and that difficulty is exactly what makes the memory stronger. Researchers
        call this the spacing effect, and it is one of the most reliable findings
        in the psychology of learning.

        A practical schedule looks like this. Review new material the next day,
        then after three days, then after a week, then after two or three weeks.
        Each successful recall earns a longer gap. If you fail to recall
        something, shorten the gap again. Flashcard apps automate this, but a
        paper notebook with dates works too.

        Three mistakes are common. First, reviewing by rereading instead of
        testing yourself: always try to answer before you look. Second, making
        cards that are too big. One fact per card, phrased as a question.
        Third, adding hundreds of cards in one week and then drowning in reviews.
        Add a steady, small number of new items each day instead.

        Spacing feels slower at first because each session is uncomfortable.
        After a month, though, you will remember far more of what you studied,
        with less total time spent. That trade is almost always worth making.
    evidence:
      site:
        counts: {approved: 4, rejected: 0}
        examples:
          - "approved: The testing effect, explained with one experiment"
          - "approved: How I plan a study week"
      similar:
        - {similarity: 0.82, title: The forgetting curve in plain words, topics: [learning-how-to-learn]}
        - {similarity: 0.71, title: Active recall for busy students, topics: [learning-how-to-learn]}

  - id: good-sql-indexes
    tags: [good]
    expected: approve
    topics: [data-databases]
    why: Accurate, useful technical explanation of when indexes help and hurt.
    page:
      url: https://rowsandcolumns.example/b-tree-indexes-when-they-help
      title: "B-tree indexes: when they help and when they don't"
      status_reason: no confident topic
      quality_score: 0.68
      content: |
        An index is a separate, sorted structure that lets the database find rows
        without reading the whole table. In most relational databases the default
        index is a B-tree: a shallow, balanced tree where each lookup touches only
        a handful of pages, even for tables with millions of rows.

        Indexes help most when a query is selective. Looking up one customer by
        email out of ten million customers is the ideal case: the database walks
        the tree, finds the matching entry, and reads one row. They help much less
        when a query matches a large share of the table. If a filter matches half
        the rows, reading the table sequentially is often cheaper than jumping
        around through the index, and a good query planner will choose to ignore
        your index.

        Column order matters in multi-column indexes. An index on (country, city)
        can answer queries that filter on country, or on country and city, but
        not queries that filter only on city. Put the column you always filter on
        first.

        Indexes are not free. Every insert, update, and delete has to maintain
        every index on the table, so a write-heavy table with ten indexes pays for
        them constantly. They also take disk space and memory.

        Before adding an index, run EXPLAIN on the slow query and read the plan.
        After adding it, run EXPLAIN again and confirm the planner uses it. If it
        doesn't, the index is only slowing down your writes.
    evidence:
      site:
        counts: {approved: 2, rejected: 0}
      similar:
        - {similarity: 0.77, title: Reading a query plan for the first time, topics: [data-databases]}

  - id: good-tcp-handshake
    tags: [good]
    expected: approve
    topics: [networking-linux, computer-science-fundamentals]
    why: Correct, well-structured explanation of a core networking concept.
    page:
      url: https://packetnotes.example/tcp-three-way-handshake
      title: The TCP three-way handshake, step by step
      status_reason: borderline quality (0.58)
      quality_score: 0.58
      content: |
        Before two computers can exchange data over TCP, they agree on a starting
        point. This agreement is the three-way handshake, and you can watch it
        happen with a packet capture tool.

        Step one: the client sends a segment with the SYN flag set and a random
        initial sequence number, say 1000. SYN means "synchronize": the client is
        announcing where its byte numbering starts.

        Step two: the server replies with both SYN and ACK set. Its acknowledgment
        number is 1001, meaning "I received your SYN and expect byte 1001 next."
        It also picks its own random sequence number, say 5000.

        Step three: the client sends an ACK with acknowledgment number 5001. Both
        sides now know each other's starting sequence numbers, and the connection
        is established.

        Why random starting numbers? If they were predictable, an attacker could
        forge segments that look like they belong to someone else's connection.
        Old segments from a previous connection on the same ports are also less
        likely to be mistaken for new data.

        Why three messages and not two? Each side must have its own starting
        number acknowledged. The server's SYN and its ACK of the client's SYN fit
        in one segment, which is why the total is three and not four.

        To see it yourself, run tcpdump on port 443 and open a website. The
        first three lines of the capture are the handshake: [S], [S.], and [.].
    evidence:
      site:
        counts: {approved: 6, rejected: 1}
      similar:
        - {similarity: 0.74, title: What a TCP port really is, topics: [networking-linux]}
      live:
        facts: [HTTP 200, 412 words, text differs from the stored copy by 1 of 64 bits]

  - id: good-clear-emails
    tags: [good]
    expected: approve
    topics: [writing-communication]
    why: Practical, original writing advice with concrete examples.
    page:
      url: https://plainwords.example/emails-people-answer
      title: How to write emails people actually answer
      status_reason: borderline quality (0.52)
      quality_score: 0.52
      content: |
        Most unanswered emails are not ignored on purpose. They are hard to act
        on. The reader opens them, can't tell what you need, and moves on,
        planning to come back later. Later rarely comes.

        Put the request in the first two lines. "Can you approve the March budget
        by Thursday?" belongs at the top, not in the fourth paragraph after the
        background. Background goes after the request, for anyone who needs it.

        Make the subject line do work. "Budget" says nothing. "Approval needed by
        Thu: March budget" tells the reader what kind of email this is before
        they open it.

        Ask one question per email when you can. If you ask three questions,
        people answer the easiest one and forget the others. When you truly need
        several answers, number them, so the reply can say "1: yes, 2: no, 3:
        let's talk."

        Make yes easy. Instead of "When are you free?", propose: "Does Tuesday at
        10 or Wednesday at 2 work?" The reader can answer with one word.

        Cut the warm-up. "I hope this email finds you well" costs the reader
        time and adds nothing. A short thank-you at the end is friendlier anyway.

        Before sending, reread the email as the busiest person you know. If they
        could answer it in under a minute, send it. If not, shorten it.
    evidence:
      site:
        counts: {approved: 3, rejected: 0}

  - id: good-git-bisect
    tags: [good]
    expected: approve
    topics: [programming-software-engineering]
    why: Teaches a useful tool accurately with a worked example.
    page:
      url: https://shipitcarefully.example/find-the-commit-with-git-bisect
      title: Find the commit that broke your build with git bisect
      status_reason: borderline quality (0.57)
      quality_score: 0.57
      content: |
        Something worked last month and is broken today, and two hundred commits
        landed in between. Reading them one by one would take an afternoon. git
        bisect finds the culprit in about eight steps, because it uses binary
        search.

        Start the search and mark the two ends:

            git bisect start
            git bisect bad            # the current commit is broken
            git bisect good v2.3.0    # this release was fine

        Git checks out a commit halfway between them. Test it: run the build or
        the failing test. Then tell git what you saw with git bisect good or git
        bisect bad. Each answer halves the remaining range. With 200 commits,
        you need at most eight answers, since two to the power of eight is 256.

        When the range shrinks to one commit, git prints it: "abc1234 is the
        first bad commit." Run git bisect reset to return to where you started.

        If you have a script that exits with 0 when things work and non-zero
        when they don't, git can do all the steps for you:

            git bisect run ./check.sh

        Two tips. If a commit can't be tested, for example because it doesn't
        compile for unrelated reasons, run git bisect skip and git picks a
        neighbor. And keep your commits small and buildable: bisect is only as
        precise as your history.
    evidence:
      site:
        counts: {approved: 5, rejected: 0}
      similar:
        - {similarity: 0.69, title: Writing commit messages your future self can use, topics: [programming-software-engineering]}

  - id: good-password-managers
    tags: [good]
    expected: approve
    topics: [cybersecurity]
    why: Sound, balanced security advice without selling a product.
    page:
      url: https://saferathome.example/password-managers-explained
      title: Password managers, explained without the sales pitch
      status_reason: borderline quality (0.59)
      quality_score: 0.59
      content: |
        The biggest password risk for most people is not a clever hacker. It is
        reuse. When one website is breached, attackers try the leaked email and
        password on hundreds of other sites. If you used the same password
        there, they get in.

        A password manager fixes reuse by remembering a different random password
        for every site. You remember one strong master password, and the manager
        fills in the rest.

        Isn't it risky to keep every password in one place? It is a trade-off.
        Reputable managers encrypt your vault on your device with a key derived
        from your master password, so the company storing your vault can't read
        it. The real risks are a weak master password and malware on your own
        computer. Pick a long passphrase of several random words, and turn on
        two-factor authentication for the manager itself.

        What to look for: the vault is encrypted on your device; the company
        has published independent security audits; it can export your data so
        you are never locked in; and it works on all the devices you use. Many
        good options exist, including free and open-source ones, and the browser
        built into your phone or computer may already include one.

        Start small. Move your email account first, because email can reset
        everything else. Then your bank. Then change reused passwords as you
        visit each site. Within a month most of your important accounts will
        have unique passwords, which is the goal.
    evidence:
      site:
        counts: {approved: 2, rejected: 0}

  - id: good-habit-stacking
    tags: [good]
    expected: approve
    topics: [habits-routines]
    why: Original, practical advice on building habits, with realistic caveats.
    page:
      url: https://smallsteps.example/attach-new-habits-to-old-ones
      title: Attach new habits to ones you already have
      status_reason: borderline quality (0.54)
      quality_score: 0.54
      content: |
        New habits fail less from lack of willpower than from lack of a trigger.
        "I'll stretch every day" has no moment attached to it, so every day the
        decision has to be made again, and on a tired day the answer is no.

        A reliable trick is to attach the new habit to something you already do
        without thinking. After I pour my morning coffee, I stretch for two
        minutes. After I close my laptop at the end of work, I write tomorrow's
        three priorities on a sticky note. The existing habit becomes the
        reminder.

        Choose an anchor that happens at the same time and place every day.
        "After lunch" is vague if your lunch moves around; "after I put my lunch
        plate in the sink" is precise.

        Keep the new habit tiny at first, small enough that you could do it on
        your worst day. Two minutes of stretching, one sentence in a journal, one
        page of reading. The point of the first month is to make the link
        automatic, not to get results. You can grow the habit once it no longer
        needs a decision.

        Expect to miss days. Missing once doesn't matter; missing twice in a row
        is where habits usually die. So the rule I use is simple: never miss
        twice.

        Finally, be honest about anchors that don't work. If you keep forgetting,
        the anchor is too weak or the habit is too big. Change one of them, not
        your opinion of yourself.
    evidence:
      site:
        counts: {approved: 1, rejected: 0}
      similar:
        - {similarity: 0.79, title: Why tiny habits stick, topics: [habits-routines]}

  - id: good-second-order-thinking
    tags: [good]
    expected: approve
    topics: [mental-models-decision-making]
    why: Clear explanation of a mental model with good, original examples.
    page:
      url: https://thinkslower.example/and-then-what
      title: "Second-order thinking: always ask \"and then what?\""
      status_reason: no confident topic
      quality_score: 0.64
      content: |
        First-order thinking asks what happens immediately. Second-order thinking
        asks what happens after that, and who reacts to it.

        A city wants less traffic, so it widens a busy road. First-order result:
        more lanes, less congestion. Second-order result: driving becomes more
        attractive, more people choose to drive, and within a few years the wider
        road is as congested as the old one. Transport planners call this induced
        demand.

        A manager wants faster releases, so she rewards the team for the number
        of features shipped. First-order: more features. Second-order: features
        get smaller and sloppier, testing gets skipped, and the team spends the
        next quarter fixing bugs.

        The habit is simple to describe and hard to practice. For any decision,
        ask "and then what?" at least twice. Then ask who else is affected and
        how they will change their behavior in response. People adapt to rules,
        prices, and incentives, and their adaptation is often the part that
        matters.

        Second-order thinking also works in your favor. Some choices look bad at
        first and good later: exercising, learning a hard skill, writing tests.
        The first-order cost is obvious; the second-order benefit is easy to
        miss.

        It is not a reason for paralysis. You can't predict everything. But
        thinking one or two steps further than the obvious catches a surprising
        number of mistakes before they happen.
    evidence:
      site:
        counts: {approved: 3, rejected: 0}

  - id: good-gradient-descent
    tags: [good]
    expected: approve
    topics: [ai-machine-learning]
    why: Accurate intuition for a core ML idea, aimed at beginners.
    page:
      url: https://mlbyhand.example/gradient-descent-intuition
      title: Gradient descent, explained with a foggy hillside
      status_reason: borderline quality (0.56)
      quality_score: 0.56
      content: |
        Imagine standing on a hillside in thick fog. You want to reach the bottom
        of the valley, but you can only see the ground around your feet. A
        sensible strategy: feel which direction slopes down most steeply, take a
        step that way, and repeat.

        That is gradient descent. A machine learning model has parameters, the
        numbers it can adjust. A loss function measures how wrong the model's
        predictions are for the current parameters. The gradient is the
        direction in which the loss increases fastest, so the algorithm steps in
        the opposite direction, lowering the loss a little each time.

        The size of each step is the learning rate. Too small, and training takes
        forever. Too large, and you overshoot the bottom, bouncing from one side
        of the valley to the other, or even climbing out of it. Choosing it well
        is one of the first practical skills in training models.

        Real loss landscapes have millions of dimensions instead of two, but the
        idea is the same. Computing the exact gradient over a whole dataset is
        expensive, so most training uses stochastic gradient descent: estimate
        the slope from a small random batch of examples, take a step, and pick a
        new batch. The steps are noisier, but there are many more of them per
        second, and the noise can even help escape poor spots.

        Variants like momentum and Adam change how steps are sized and combined,
        but underneath they are still a hiker in fog, feeling for the way down.
    evidence:
      site:
        counts: {approved: 2, rejected: 0}
      similar:
        - {similarity: 0.73, title: What a loss function measures, topics: [ai-machine-learning]}

  - id: good-but-unchecked-one-on-ones
    tags: [good, guardrail]
    expected: approve
    topics: [career-growth-in-tech]
    safety: unchecked
    why: >-
      A good page; the agent should approve it. Safe Browsing isn't configured
      for this case, so the guardrails must hold it for a person anyway.
    page:
      url: https://growingengineers.example/get-more-from-one-on-ones
      title: Get more out of your one-on-ones with your manager
      status_reason: safety not checked (no Safe Browsing key)
      quality_score: 0.71
      content: |
        A weekly one-on-one with your manager is the most valuable thirty
        minutes on your calendar, and most engineers waste it on status updates
        their manager could read in the ticket tracker.

        Own the agenda. Keep a running document that both of you can edit, and
        add topics during the week as they come up. Put the most important item
        first, because meetings run out of time.

        Bring problems early, with options. "The migration is slipping because
        the test environment is shared; I see two fixes, which do you prefer?"
        gets a decision in two minutes. Waiting until the deadline turns the same
        conversation into a crisis.

        Ask for specific feedback. "Any feedback?" gets "you're doing great."
        "What's one thing I could have done better in the design review?" gets
        something you can use.

        Talk about growth at least once a month. Where do you want to be in a
        year? What would your manager need to see to support a promotion? Write
        the answer down and revisit it, so it doesn't evaporate between
        performance cycles.

        Finally, use the time to understand your manager's priorities. Knowing
        what your manager is being measured on tells you which of your work will
        be noticed, and lets you help them, which tends to come back to you.
    evidence:
      site:
        counts: {approved: 3, rejected: 0}

