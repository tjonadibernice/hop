      status_reason: content changed
      quality_score: 0.66
      content: |
        Big-O notation describes how an algorithm's running time grows as its
        input grows. It ignores constant factors and focuses on the shape of
        the growth. Searching an unsorted list is O(n): twice the items, twice
        the work. Binary search on a sorted list is O(log n): doubling the list
        adds only one more step. Comparing every pair of items is O(n squared):
        doubling the list makes the work four times larger. When choosing
        between algorithms, the shape usually matters more than the details,
        because inputs tend to grow.
