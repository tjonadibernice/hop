        You need three ripe bananas, 75 grams of melted butter, 150 grams of
        brown sugar, one egg, a teaspoon of vanilla, a teaspoon of baking soda,
        a pinch of salt, and 190 grams of flour.

        Heat the oven to 175 degrees Celsius and line a loaf tin. Mash the
        bananas in a bowl, then stir in the melted butter. Mix in the sugar,
        egg, and vanilla. Sprinkle the baking soda and salt over the mixture and
        stir. Fold in the flour until just combined; overmixing makes the loaf
        tough.

        Bake for about 60 minutes, until a skewer comes out clean. Let it cool
        in the tin for ten minutes before turning it out. It keeps for three
        days wrapped at room temperature, and it freezes well in slices.
