[project]
name = "hop-backend"
version = "0.1.0"
description = "FastAPI backend for Hop, a discovery app that recommends pages users would never have found."
readme = "README.md"
authors = [
    { name = "bernice", email = "tjonadibernice@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false