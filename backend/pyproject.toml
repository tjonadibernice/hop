[project]
name = "hop-backend"
version = "0.1.0"
description = "FastAPI backend for Hop, a discovery app that recommends pages users would never have found."
readme = "README.md"
authors = [
    { name = "bernice", email = "tjonadibernice@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "lxml>=6.1.3",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
# The integration tests in integration/ run against a running container:
# make integration
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff.lint.isort]
known-first-party = ["app"]
